name: images

# Builds, TESTS, then publishes the images. An image is only published when all
# its tests pass (tests/run.sh). Source of truth: images.txt.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the images that pass their tests"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 1 * *"
  push:
    branches:
      - master
    paths:
      - images.txt
      - tests/**
      - scripts/**
      - oses/**
      - installers/**
      - go/**
      - java/**
      - nodejs/**
      - python/**
      - games/**
      - .github/workflows/images.yml
  pull_request:
    paths:
      - images.txt
      - tests/**
      - scripts/**
      - oses/**
      - installers/**
      - go/**
      - java/**
      - nodejs/**
      - python/**
      - games/**
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          publish=false
          case "$EVENT" in
            push|schedule) publish=true ;;
            workflow_dispatch) publish="$INPUT_PUBLISH" ;;
          esac
          # Never publish from a branch other than the default one
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Compute the matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Scheduled / manual runs: rebuild everything (base image security patches).
          # PR / push: only the images that were touched.
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            base="" ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --name-only "$base" "$SHA" > "$RUNNER_TEMP/changed.txt"
            matrix="$(scripts/matrix.sh --changed "$RUNNER_TEMP/changed.txt")"
          else
            matrix="$(scripts/matrix.sh)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$matrix" | grep -o '"ids"' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  image:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - uses: docker/setup-buildx-action@v3

      # Exposes the runtime token needed by the GitHub Actions build cache (type=gha).
      - uses: crazy-max/ghaction-github-runtime@v3

      - uses: docker/login-action@v3
        if: needs.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test (then publish if everything passes)
        env:
          DEPOT_TEST_NETWORK: "1"
          DEPOT_CACHE: gha
          DEPOT_TEST_E2E: "1"
          PUBLISH: ${{ needs.plan.outputs.publish }}
          IDS: ${{ matrix.ids }}
        run: |
          args=(--all-platforms)
          if [ "$PUBLISH" = "true" ]; then
            export DEPOT_TAG_SUFFIX="$(date -u +%Y%m%d)"
            args+=(--publish)
          fi
          # shellcheck disable=SC2086
          tests/run.sh "${args[@]}" $IDS

  # Single check to require in branch protection.
  result:
    name: images ok
    needs: [plan, image]
    if: always()
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ needs.plan.result }}
      IMAGE: ${{ needs.image.result }}
    steps:
      - run: |
          echo "plan=$PLAN image=$IMAGE"
          [ "$PLAN" = "success" ]
          case "$IMAGE" in success|skipped) ;; *) exit 1 ;; esac
